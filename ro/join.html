var FLAGS = {"PL": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0\" y=\"0.000\" width=\"3\" height=\"1.000\" fill=\"#FFFFFF\"/><rect x=\"0\" y=\"1.000\" width=\"3\" height=\"1.000\" fill=\"#DC143C\"/><\/svg>", "RO": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#002B7F\"/><rect x=\"1.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#FCD116\"/><rect x=\"2.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#CE1126\"/><\/svg>", "BG": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0\" y=\"0.000\" width=\"3\" height=\"0.667\" fill=\"#FFFFFF\"/><rect x=\"0\" y=\"0.667\" width=\"3\" height=\"0.667\" fill=\"#00966E\"/><rect x=\"0\" y=\"1.333\" width=\"3\" height=\"0.667\" fill=\"#D62612\"/><\/svg>", "HU": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0\" y=\"0.000\" width=\"3\" height=\"0.667\" fill=\"#CD2A3E\"/><rect x=\"0\" y=\"0.667\" width=\"3\" height=\"0.667\" fill=\"#FFFFFF\"/><rect x=\"0\" y=\"1.333\" width=\"3\" height=\"0.667\" fill=\"#436F4D\"/><\/svg>", "ES": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0\" y=\"0.000\" width=\"3\" height=\"0.500\" fill=\"#AA151B\"/><rect x=\"0\" y=\"0.500\" width=\"3\" height=\"1.000\" fill=\"#F1BF00\"/><rect x=\"0\" y=\"1.500\" width=\"3\" height=\"0.500\" fill=\"#AA151B\"/><\/svg>", "UK": "<svg class=\"flag\" viewBox=\"0 0 60 30\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\"><clipPath id=\"uk-t\"><path d=\"M30 15h30v15zv15H0zH0V0zV0h30z\"/><\/clipPath><path d=\"M0 0v30h60V0z\" fill=\"#012169\"/><path d=\"M0 0l60 30m0-30L0 30\" stroke=\"#fff\" stroke-width=\"6\"/><path d=\"M0 0l60 30m0-30L0 30\" clip-path=\"url(#uk-t)\" stroke=\"#C8102E\" stroke-width=\"4\"/><path d=\"M30 0v30M0 15h60\" stroke=\"#fff\" stroke-width=\"10\"/><path d=\"M30 0v30M0 15h60\" stroke=\"#C8102E\" stroke-width=\"6\"/><\/svg>", "DE": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0\" y=\"0.000\" width=\"3\" height=\"0.667\" fill=\"#000000\"/><rect x=\"0\" y=\"0.667\" width=\"3\" height=\"0.667\" fill=\"#DD0000\"/><rect x=\"0\" y=\"1.333\" width=\"3\" height=\"0.667\" fill=\"#FFCE00\"/><\/svg>", "NL": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0\" y=\"0.000\" width=\"3\" height=\"0.667\" fill=\"#AE1C28\"/><rect x=\"0\" y=\"0.667\" width=\"3\" height=\"0.667\" fill=\"#FFFFFF\"/><rect x=\"0\" y=\"1.333\" width=\"3\" height=\"0.667\" fill=\"#21468B\"/><\/svg>", "BE": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#000000\"/><rect x=\"1.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#FDDA24\"/><rect x=\"2.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#EF3340\"/><\/svg>", "FR": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#002654\"/><rect x=\"1.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#FFFFFF\"/><rect x=\"2.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#CE1126\"/><\/svg>", "IT": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect x=\"0.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#009246\"/><rect x=\"1.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#FFFFFF\"/><rect x=\"2.000\" y=\"0\" width=\"1.000\" height=\"2\" fill=\"#CE2B37\"/><\/svg>", "CH": "<svg class=\"flag\" viewBox=\"0 0 3 2\" aria-hidden=\"true\"><rect width=\"3\" height=\"2\" fill=\"#DA291C\"/><path d=\"M1.3 .45h.4v.35h.35v.4h-.35v.35h-.4v-.35H.95v-.4h.35z\" fill=\"#fff\"/><\/svg>"};
// The "Join Transporters" flow: one question per frame, saved to Supabase
// (table transporter_applications, insert only).
(function () {
  var API = 'https://htegjzxfspdaclcvfjfl.supabase.co/rest/v1/transporter_applications';
  var KEY = 'sb_publishable_2spxK11Ldq3pj2EjJeoPbw_TVsZuKnL'; // public key, same as the apps
  var DRAFT = 'domivan-join-draft';
  var form = document.getElementById('join'), box = form.querySelector('.q');
  var bar = form.querySelector('.progress span'), count = form.querySelector('.count'), back = form.querySelector('.back');
  var a = {};
  try { a = JSON.parse(localStorage.getItem(DRAFT)) || {}; } catch (e) {}
  var save = function () { try { localStorage.setItem(DRAFT, JSON.stringify(a)); } catch (e) {} };
  var esc = function (v) { return String(v).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var digits = function (v) { return String(v || '').replace(/\D/g, ''); };
  // Light format checks for each country's company number; staff verify the real thing.
  var REG = {
    PL: function (d) { return d.length === 10; },                  // NIP or KRS
    RO: function (d) { return d.length >= 2 && d.length <= 10; },  // CUI
    BG: function (d) { return d.length === 9 || d.length === 13; }, // EIK / UIC
    HU: function (d) { return d.length === 8 || d.length === 10 || d.length === 11; } // adószám or cégjegyzékszám
  };
  var yesNo = [{ v: 'yes', t: T.yes }, { v: 'no', t: T.no }];
  var STEPS = [
    { id: 'country', q: T.q_country, type: 'one', opts: ['PL', 'RO', 'BG', 'HU'].map(function (c) { return { v: c, t: T.countries[c], flag: c }; }) },
    { id: 'business_type', q: T.q_kind, type: 'one', opts: [{ v: 'company', t: T.kind_company }, { v: 'self_employed', t: T.kind_self }] },
    { id: 'company', q: T.q_company, type: 'fields', fields: function () {
        return [
          { k: 'company_name', label: T.f_company, ac: 'organization' },
          { k: 'reg_number', label: T.f_reg, hint: T.reg_hint[a.country] || '', mode: 'numeric' },
          { k: 'vat_number', label: T.f_vat, optional: true }
        ];
      }, check: function () {
        if (!REG[a.country] || REG[a.country](digits(a.reg_number))) return '';
        return { k: 'reg_number', e: T.err_reg.replace('{country}', T.countries[a.country]) };
      } },
    { id: 'licence', q: T.q_licence, sub: T.licence_sub, type: 'one', opts: [{ v: 'yes', t: T.yes }, { v: 'applying', t: T.licence_applying }, { v: 'no', t: T.no }] },
    { id: 'fleet_size', q: T.q_fleet, type: 'one', grid: true, opts: ['1', '2-5', '6-10', '11+'].map(function (v) { return { v: v, t: v.replace('-', '–') }; }) },
    { id: 'van_classes', q: T.q_vans, sub: T.pick_all, type: 'many', opts: [
        { v: 'standard', t: T.van_std, s: T.van_std_cap }, { v: 'large', t: T.van_lg, s: T.van_lg_cap }, { v: 'luxury', t: T.van_lux, s: T.van_lux_cap }] },
    { id: 'destinations', q: T.q_routes, sub: T.pick_all, type: 'many', grid: true, opts: ['DE', 'NL', 'BE', 'FR', 'UK', 'ES', 'IT', 'CH'].map(function (c) { return { v: c, t: T.countries[c], flag: c }; }) },
    { id: 'passenger_insurance', q: T.q_insurance, type: 'one', opts: yesNo },
    { id: 'technical_inspection', q: T.q_inspection, type: 'one', opts: yesNo },
    { id: 'name', q: T.q_name, type: 'fields', fields: function () { return [{ k: 'full_name', label: T.f_name, ac: 'name' }]; } },
    { id: 'contact', q: T.q_contact, type: 'fields', fields: function () {
        return [{ k: 'phone', label: T.f_phone, type: 'tel', ac: 'tel' }, { k: 'email', label: T.f_email, type: 'email', ac: 'email' }];
      }, check: function () {
        if (digits(a.phone).length < 6 || digits(a.phone).length > 15) return { k: 'phone', e: T.err_phone };
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email || '')) return { k: 'email', e: T.err_email };
        return '';
      } },
    { id: 'confirm', q: T.q_confirm, sub: T.confirm_sub, type: 'confirm' }
  ];
  var i = 0, busy = false;

  function optHtml(s, o) {
    var on = s.type === 'many' ? (a[s.id] || []).indexOf(o.v) >= 0 : a[s.id] === o.v;
    return '<button type="button" class="opt' + (on ? ' on' : '') + '" data-v="' + esc(o.v) + '" aria-pressed="' + on + '">'
      + (o.flag ? FLAGS[o.flag] : '') + '<span><b>' + esc(o.t) + '</b>' + (o.s ? '<small>' + esc(o.s) + '</small>' : '') + '</span>'
      + (s.type === 'many' ? '<i class="tick" aria-hidden="true"></i>' : '') + '</button>';
  }

  function render(dir) {
    var s = STEPS[i], h = '<h1>' + esc(s.q) + '</h1>' + (s.sub ? '<p class="qsub">' + esc(s.sub) + '</p>' : '');
    if (s.type === 'one' || s.type === 'many') {
      h += '<div class="opts' + (s.grid ? ' grid' : '') + '">' + s.opts.map(function (o) { return optHtml(s, o); }).join('') + '</div>';
    } else if (s.type === 'fields') {
      h += '<div class="fields">' + s.fields().map(function (f) {
        return '<label><span>' + esc(f.label) + '</span><input name="' + f.k + '" type="' + (f.type || 'text') + '"'
          + (f.ac ? ' autocomplete="' + f.ac + '"' : '') + (f.mode ? ' inputmode="' + f.mode + '"' : '')
          + ' value="' + esc(a[f.k] || '') + '">' + (f.hint ? '<small>' + esc(f.hint) + '</small>' : '') + '<em class="err" data-for="' + f.k + '"></em></label>';
      }).join('') + '</div>';
    } else if (s.type === 'confirm') {
      h += '<dl class="sum">' + [
        [T.f_company, a.company_name], [T.f_reg, a.reg_number + ' · ' + (T.countries[a.country] || '')],
        [T.f_name, a.full_name], [T.f_email, a.email]
      ].map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1] || '') + '</dd></div>'; }).join('') + '</dl>'
        + '<label class="consent"><input type="checkbox" name="consent"' + (a.consent ? ' checked' : '') + '><span>' + T.consent + '</span></label>';
    }
    if (s.type !== 'one') h += '<em class="err" data-for="_"></em><button type="submit" class="btn big next">' + esc(s.type === 'confirm' ? T.submit : T.next) + '</button>';
    else h += '<em class="err" data-for="_"></em>';
    var show = function () {
      box.innerHTML = h;
      box.className = 'q from-' + (dir < 0 ? 'left' : 'right');
      void box.offsetWidth; box.className = 'q';
      bar.style.width = Math.round((i + 1) / (STEPS.length + 1) * 100) + '%';
      count.textContent = T.step.replace('{n}', i + 1).replace('{total}', STEPS.length);
      back.hidden = i === 0;
      var first = box.querySelector('input:not([type=checkbox])');
      if (first && window.matchMedia('(min-width: 700px)').matches) first.focus({ preventScroll: true });
    };
    if (dir === 0) return show();
    box.className = 'q to-' + (dir < 0 ? 'right' : 'left');
    setTimeout(show, 180);
  }

  function err(k, msg) {
    box.querySelectorAll('.err').forEach(function (e) { e.textContent = ''; });
    var e = box.querySelector('.err[data-for="' + k + '"]') || box.querySelector('.err[data-for="_"]');
    e.textContent = msg;
    var input = box.querySelector('[name="' + k + '"]'); if (input) input.focus();
  }

  function next() {
    var s = STEPS[i];
    if (s.type === 'fields') {
      var fs = s.fields();
      for (var n = 0; n < fs.length; n++) {
        a[fs[n].k] = box.querySelector('[name="' + fs[n].k + '"]').value.trim();
        if (!fs[n].optional && a[fs[n].k].length < 2) return err(fs[n].k, T.err_required);
      }
      var c = s.check && s.check(); save();
      if (c) return err(c.k, c.e);
    } else if (s.type === 'many' && !(a[s.id] || []).length) return err('_', T.err_pick);
    else if (s.type === 'one' && !a[s.id]) return;
    else if (s.type === 'confirm') return submit();
    save(); i++; render(1);
  }

  function submit() {
    a.consent = box.querySelector('[name=consent]').checked;
    if (!a.consent) return err('_', T.err_consent);
    if (busy) return;
    if (form.elements.website.value) return done(); // bots fill the hidden field
    busy = true;
    var btn = box.querySelector('.next'); btn.disabled = true; btn.textContent = T.sending;
    var row = {
      lang: document.documentElement.lang, country: a.country, business_type: a.business_type,
      company_name: a.company_name, reg_number: a.reg_number, vat_number: a.vat_number || null,
      licence: a.licence, fleet_size: a.fleet_size, van_classes: a.van_classes, destinations: a.destinations,
      passenger_insurance: a.passenger_insurance === 'yes', technical_inspection: a.technical_inspection === 'yes',
      full_name: a.full_name, phone: a.phone, email: a.email
    };
    fetch(API, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(row) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); done(); })
      .catch(function () { busy = false; btn.disabled = false; btn.textContent = T.submit; err('_', T.err_send); });
  }

  function done() {
    try { localStorage.removeItem(DRAFT); } catch (e) {}
    bar.style.width = '100%'; back.hidden = true; count.textContent = '';
    box.className = 'q to-left';
    setTimeout(function () {
      box.innerHTML = '<div class="done-mark" aria-hidden="true">✓</div><h1>' + esc(T.done_h.replace('{name}', (a.full_name || '').split(' ')[0])) + '</h1>'
        + '<p class="qsub">' + esc(T.done_p) + '</p><a class="btn big next" href="' + esc(T.home) + '">' + esc(T.done_cta) + '</a>';
      box.className = 'q';
    }, 180);
  }

  box.addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b) return;
    var s = STEPS[i];
    if (s.type === 'many') {
      var list = a[s.id] || [], at = list.indexOf(b.dataset.v);
      if (at >= 0) list.splice(at, 1); else list.push(b.dataset.v);
      a[s.id] = list; b.classList.toggle('on'); b.setAttribute('aria-pressed', at < 0); save();
    } else {
      a[s.id] = b.dataset.v; save();
      box.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('on', o === b); });
      setTimeout(next, 220);
    }
  });
  form.addEventListener('submit', function (e) { e.preventDefault(); next(); });
  back.addEventListener('click', function () { if (i > 0) { i--; render(-1); } });
  render(0);
})();
</script>
</body>
</html>
